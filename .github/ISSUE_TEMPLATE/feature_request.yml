name: "💡 功能建议"
description: "提出新功能、交互改进或创作者工作流建议"
title: "[Suggestion]: "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 UpLingo 提供想法！请先搜索现有 Issue，看看是否已经有人提出类似建议。

  - type: dropdown
    id: category
    attributes:
      label: "建议类型"
      options:
        - "粉丝数据与对标"
        - "成就与激励效果"
        - "投稿与软件打卡"
        - "使用统计"
        - "设置与界面交互"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: problem-or-need
    attributes:
      label: "希望解决的问题"
      description: "请描述当前遇到的不便、使用场景或需求。"
      placeholder: "例如：当……时，我希望能够……"
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "建议的实现方式"
      description: "请说明你希望 UpLingo 如何表现，越具体越容易评估。"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的替代方案"
      description: "如果有其他解决方法或取舍，可以写在这里。"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "补充信息"
      description: "可以添加草图、截图、参考项目或其他说明。请勿包含私人配置或 API Key。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交前确认"
      options:
        - label: "我已经搜索过现有 Issue，没有发现相同建议。"
          required: true
        - label: "此建议中不包含 API Key、配置或其他私人信息。"
          required: true
