name: "🐛 Bug 反馈"
description: "报告可稳定复现的异常、错误或界面问题"
title: "[Bug]: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 UpLingo！提交前请先确认正在使用最新版本，并搜索现有 Issue，避免重复反馈。

        **请勿上传 `config.json`、YouTube API Key 或其他私人信息。** 如需提供日志或截图，请先移除其中的敏感内容。

  - type: input
    id: uplingo-version
    attributes:
      label: "UpLingo 版本"
      description: "可在程序标题或可执行文件名中查看。"
      placeholder: "例如：v1.10.2"
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: "Windows 版本"
      options:
        - "Windows 11"
        - "Windows 10"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: "问题描述"
      description: "请说明发生了什么，以及你原本期望看到什么。"
      placeholder: |
        实际结果：
        期望结果：
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "复现步骤"
      description: "请尽可能写出可以稳定触发问题的操作步骤。"
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "截图或录屏"
      description: "可以直接拖入图片或视频。上传前请遮挡账号、频道和密钥等私人信息。"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "相关日志"
      description: "如有需要，可粘贴相关日志片段；请勿上传完整配置文件，并先移除 API Key 等敏感内容。"
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交前确认"
      options:
        - label: "我正在使用最新版本的 UpLingo。"
          required: true
        - label: "我已经搜索过现有 Issue，没有发现相同问题。"
          required: true
        - label: "我已经从内容中移除 API Key、配置和其他私人信息。"
          required: true
